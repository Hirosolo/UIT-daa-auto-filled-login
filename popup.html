<!DOCTYPE html>
<html>
  <head>
    <style>
      :root {
        --fb-blue: #1877f2;
        --bg: #f0f2f5;
        --card: #ffffff;
        --text: #050505;
        --muted: #65676b;
        --border: #dadde1;
        --radius: 8px;
        --font: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
          sans-serif;
      }

      body {
        margin: 0;
        padding: 12px;
        width: 280px;
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
      }

      .card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 12px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      }

      h3 {
        margin: 0 0 12px;
        font-size: 14px;
        font-weight: 600;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .label {
        font-weight: 500;
      }

      .muted {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 4px;
      }

      /* Switch toggle */
      .switch {
        position: relative;
        width: 38px;
        height: 20px;
      }

      .switch input {
        display: none;
      }

      .slider {
        position: absolute;
        inset: 0;
        background: #ccd0d5;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.2s;
      }

      .slider::before {
        content: "";
        position: absolute;
        height: 16px;
        width: 16px;
        left: 2px;
        top: 2px;
        background: white;
        border-radius: 50%;
        transition: transform 0.2s;
      }

      input:checked + .slider {
        background: var(--fb-blue);
      }

      input:checked + .slider::before {
        transform: translateX(18px);
      }

      select,
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 7px 9px;
        border-radius: 6px;
        border: 1px solid var(--border);
        font-size: 13px;
        margin-bottom: 8px;
      }

      select:focus,
      input:focus {
        outline: none;
        border-color: var(--fb-blue);
      }

      button {
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 6px;
        background: var(--fb-blue);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }

      .hidden {
        display: none;
      }

      .status {
        margin-top: 6px;
        text-align: center;
        font-size: 12px;
        color: #31a24c;
      }

      .credentials {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
        margin-right: 16px;
      }

      .credentials input {
        margin: 0;
      }

      .credentials button {
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h3>UIT Auto Login</h3>

      <!-- Toggle -->
      <div class="row">
        <div class="label">Enable auto login</div>
        <label class="switch">
          <input type="checkbox" id="enabled" />
          <span class="slider"></span>
        </label>
      </div>

      <!-- Mode -->
      <div class="muted">Login method</div>
      <select id="mode">
        <option value="autofill">Browser autofill</option>
        <option value="stored">Stored credentials</option>
      </select>

      <!-- Stored credentials -->
      <div id="storedFields" class="credentials hidden">
        <input id="studentId" type="text" placeholder="Student ID" />
        <input id="password" type="password" placeholder="Password" />
        <button id="save">Save credentials</button>
        <div id="status" class="status"></div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
